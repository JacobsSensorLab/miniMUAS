[package]
name = "ndn-fleet"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The miniMUAS fleet deploy + measurement protocol, as an MCP server and a CLI"
publish = false

# Standalone: not a member of any sibling workspace.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "io-util", "sync", "fs"] }
